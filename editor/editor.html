<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebShot Studio</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="studio-app">
    <!-- Top Minimal Navigation Bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <div class="brand-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </div>
          <span class="brand-title">WebShot</span>
        </div>

        <div class="doc-meta">
          <span id="docTitle" class="doc-title" title="Capture Title">Loading screenshot...</span>
          <span id="docDimensions" class="doc-dims">0 × 0 px</span>
        </div>
      </div>

      <!-- Center Zoom Controls -->
      <div class="header-center">
        <div class="zoom-controls">
          <button id="btnZoomOut" class="btn-icon" title="Zoom Out (Ctrl + -)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <span id="zoomLevelText" class="zoom-text">100%</span>
          <button id="btnZoomIn" class="btn-icon" title="Zoom In (Ctrl + +)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
          <div class="divider-v"></div>
          <button id="btnZoomFit" class="btn-text" title="Fit to Screen">Fit</button>
          <button id="btnZoom100" class="btn-text" title="Actual Size (100%)">100%</button>
        </div>
      </div>

      <!-- Right Actions: Undo, Redo, Copy, Download -->
      <div class="header-right">
        <button id="btnUndo" class="btn-icon" title="Undo (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7v6h6"/>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
          </svg>
        </button>
        <button id="btnRedo" class="btn-icon" title="Redo (Ctrl+Y)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 7v6h-6"/>
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
          </svg>
        </button>

        <button id="btnClear" class="btn-icon" title="Clear all annotations">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>

        <div class="divider-v"></div>

        <!-- Copy to Clipboard Button -->
        <button id="btnCopy" class="btn-action secondary" title="Copy screenshot to clipboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span>Copy</span>
        </button>

        <!-- Download Button with Dropdown -->
        <div class="download-group">
          <button id="btnDownload" class="btn-action primary" title="Download image with annotations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>Download</span>
          </button>
          <button id="btnDownloadMenu" class="btn-action primary dropdown-toggle" title="Download options">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div id="downloadMenu" class="dropdown-menu hidden">
            <button data-format="png" class="menu-item active">
              <span>PNG Image (.png)</span>
              <span class="subtext">Lossless & sharp</span>
            </button>
            <button data-format="jpeg" class="menu-item">
              <span>JPEG Image (.jpg)</span>
              <span class="subtext">Compact photo</span>
            </button>
            <button data-format="webp" class="menu-item">
              <span>WebP Image (.webp)</span>
              <span class="subtext">Modern web format</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Floating Minimal Tool Dock -->
    <aside class="tool-dock">
      <button class="dock-btn active" data-tool="select" title="Select & Move (V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
          <path d="m13 13 6 6"/>
        </svg>
      </button>

      <div class="dock-divider"></div>

      <button class="dock-btn" data-tool="rectangle" title="Rectangle Shape (R)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="ellipse" title="Circle / Ellipse (O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="arrow" title="Arrow Callout (A)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="19" x2="19" y2="5"/>
          <polyline points="10 5 19 5 19 14"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="line" title="Straight Line (L)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="19" x2="19" y2="5"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="highlighter" title="Highlighter (H)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m9 11-6 6v3h3l6-6"/>
          <path d="m22 7-4.5-4.5a2.12 2.12 0 0 0-3 0L3.5 13.5a2.12 2.12 0 0 0 0 3L6 19"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="pen" title="Freehand Pen (P)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="text" title="Text Annotation (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="4 7 4 4 20 4 20 7"/>
          <line x1="9" y1="20" x2="15" y2="20"/>
          <line x1="12" y1="4" x2="12" y2="20"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="blur" title="Blur / Redact Sensitive Data (B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="3 3"/>
          <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="16" r="1.5" fill="currentColor"/>
          <circle cx="16" cy="8" r="1.5" fill="currentColor"/>
          <circle cx="8" cy="16" r="1.5" fill="currentColor"/>
        </svg>
      </button>

      <button class="dock-btn" data-tool="step" title="Step Counter Badge (1, 2, 3...) (N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
          <text x="12" y="16" font-size="11" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">1</text>
        </svg>
      </button>
    </aside>

    <!-- Properties Bar (Contextual options for active tool/selection) -->
    <div id="propertiesBar" class="properties-bar">
      <!-- Color Palette -->
      <div class="prop-section">
        <span class="prop-label">Color</span>
        <div class="color-palette">
          <button class="color-swatch active" style="background-color: #ef4444;" data-color="#ef4444"></button>
          <button class="color-swatch" style="background-color: #6366f1;" data-color="#6366f1"></button>
          <button class="color-swatch" style="background-color: #10b981;" data-color="#10b981"></button>
          <button class="color-swatch" style="background-color: #f59e0b;" data-color="#f59e0b"></button>
          <button class="color-swatch" style="background-color: #06b6d4;" data-color="#06b6d4"></button>
          <button class="color-swatch" style="background-color: #ec4899;" data-color="#ec4899"></button>
          <button class="color-swatch" style="background-color: #ffffff;" data-color="#ffffff"></button>
          <button class="color-swatch" style="background-color: #0f172a;" data-color="#0f172a"></button>
          <label class="color-picker-label" title="Custom color">
            <input type="color" id="customColorInput" value="#ef4444">
            <span class="custom-color-icon">+</span>
          </label>
        </div>
      </div>

      <div class="prop-divider"></div>

      <!-- Stroke Width -->
      <div class="prop-section" id="strokeSection">
        <span class="prop-label">Stroke</span>
        <div class="stroke-options">
          <button class="stroke-btn" data-width="2">Thin (2px)</button>
          <button class="stroke-btn active" data-width="4">Medium (4px)</button>
          <button class="stroke-btn" data-width="8">Thick (8px)</button>
          <button class="stroke-btn" data-width="14">Heavy (14px)</button>
        </div>
      </div>

      <!-- Fill Option for Shapes -->
      <div class="prop-section" id="fillSection">
        <div class="prop-divider"></div>
        <label class="checkbox-label">
          <input type="checkbox" id="checkFill">
          <span>Filled Shape</span>
        </label>
      </div>

      <!-- Font Size for Text -->
      <div class="prop-section hidden" id="fontSection">
        <div class="prop-divider"></div>
        <span class="prop-label">Size</span>
        <select id="selectFontSize" class="prop-select">
          <option value="16">16px</option>
          <option value="20">20px</option>
          <option value="28" selected>28px</option>
          <option value="36">36px</option>
          <option value="48">48px</option>
        </select>
      </div>

      <!-- Delete Action for Selection -->
      <div class="prop-section hidden" id="deleteSection">
        <div class="prop-divider"></div>
        <button id="btnDeleteSelected" class="btn-delete" title="Delete selected annotation (Delete / Backspace)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
          <span>Delete</span>
        </button>
      </div>
    </div>

    <!-- Main Studio Canvas Viewport -->
    <main class="canvas-viewport" id="viewport">
      <div class="canvas-stage" id="stage">
        <!-- Base Screenshot Canvas -->
        <canvas id="baseCanvas"></canvas>
        <!-- Interactive Vector Annotation Overlay Canvas -->
        <canvas id="annotationCanvas"></canvas>
      </div>

      <!-- Loading / Stitching Overlay -->
      <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-card">
          <div class="loading-spinner"></div>
          <h3 id="loadingText">Stitching high-resolution screenshot...</h3>
          <p id="loadingSubtext">Processing pixel chunks</p>
        </div>
      </div>
    </main>

    <!-- Floating Toast Notification -->
    <div id="toast" class="toast hidden">
      <div class="toast-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <span id="toastMessage">Copied to clipboard!</span>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="editor.js"></script>
</body>
</html>
