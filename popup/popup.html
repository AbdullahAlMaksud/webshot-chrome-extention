<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span class="logo-text">WebShot</span>
      </div>
      <span class="badge">PRO</span>
    </header>

    <!-- Main Options -->
    <div id="optionsView" class="options-view">
      <button id="btnFullPage" class="action-card primary">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M7 8h10M7 12h10M7 16h6"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">Full Page</span>
          <span class="card-desc">Capture entire scrollable page</span>
        </div>
      </button>

      <button id="btnVisible" class="action-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">Visible Area</span>
          <span class="card-desc">Capture current screen</span>
        </div>
      </button>

      <button id="btnArea" class="action-card">
        <div class="card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2v4M2 6h4M18 2v4M22 6h-4M6 22v-4M2 18h4M18 22v-4M22 18h-4"/>
            <rect x="7" y="7" width="10" height="10" stroke-dasharray="2 2"/>
          </svg>
        </div>
        <div class="card-text">
          <span class="card-title">Selected Area</span>
          <span class="card-desc">Drag to crop any section</span>
        </div>
      </button>
    </div>

    <!-- Progress View -->
    <div id="progressView" class="progress-view hidden">
      <div class="progress-spinner-wrap">
        <div class="spinner"></div>
      </div>
      <div id="progressStatus" class="progress-status">Capturing full page...</div>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
      </div>
      <span id="progressPercent" class="progress-percent">0%</span>
    </div>

    <!-- Error View -->
    <div id="errorView" class="error-view hidden">
      <div class="error-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div id="errorMessage" class="error-message">Something went wrong</div>
      <button id="btnRetry" class="btn-retry">Try Again</button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Auto-stitches & opens editor studio</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
